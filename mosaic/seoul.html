    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightbox-prev">&#8249;</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-nav lightbox-next" id="lightbox-next">&#8250;</button>
        <p class="lightbox-caption" id="lightbox-caption"></p>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxClose = document.getElementById('lightbox-close');
        const header = document.querySelector('.site-header');

        function positionCloseBtn() {
            const headerBottom = header.getBoundingClientRect().bottom;
            lightboxClose.style.top = (headerBottom + 12) + 'px';
        }
        positionCloseBtn();
        window.addEventListener('resize', positionCloseBtn);

        const imgs = Array.from(document.querySelectorAll('.galerie-item img'));
        let currentIndex = 0;

        imgs.forEach((img, i) => {
            if (img.complete) {
                img.classList.add('loaded');
            } else {
                img.addEventListener('load', () => img.classList.add('loaded'));
            }

            img.addEventListener('click', () => openLightbox(i));
        });

        function openLightbox(index) {
            currentIndex = index;
            const img = imgs[currentIndex];
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            const figcaption = img.closest('.galerie-item').querySelector('figcaption');
            lightboxCaption.textContent = figcaption ? figcaption.textContent : '';
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxImg.src = '';
        }

        function navigate(dir) {
            currentIndex = (currentIndex + dir + imgs.length) % imgs.length;
            const img = imgs[currentIndex];
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
            const figcaption = img.closest('.galerie-item').querySelector('figcaption');
            lightboxCaption.textContent = figcaption ? figcaption.textContent : '';
        }

        document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
        document.getElementById('lightbox-prev').addEventListener('click', () => navigate(-1));
        document.getElementById('lightbox-next').addEventListener('click', () => navigate(1));

        lightbox.addEventListener('click', e => {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                if (lightbox.classList.contains('active')) closeLightbox();
                else closeNavPanel();
            }
            if (lightbox.classList.contains('active')) {
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
            }
        });

        const navPanel = document.getElementById('nav-panel');
        const navBackdrop = document.getElementById('nav-panel-backdrop');

        function openNavPanel() {
            navPanel.classList.add('open');
            navBackdrop.classList.add('open');
            header.style.opacity = '0';
            header.style.pointerEvents = 'none';
        }
        function closeNavPanel() {
            navPanel.classList.remove('open');
            navBackdrop.classList.remove('open');
            header.style.opacity = '1';
            header.style.pointerEvents = '';
        }

        document.getElementById('index-toggle').addEventListener('click', e => {
            e.preventDefault();
            navPanel.classList.contains('open') ? closeNavPanel() : openNavPanel();
        });

        document.getElementById('nav-panel-close').addEventListener('click', closeNavPanel);
        navBackdrop.addEventListener('click', closeNavPanel);
    </script>
