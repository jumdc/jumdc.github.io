        body {

            padding-bottom: 0 !important;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .site-header { flex-shrink: 0; }
        .carousel-wrapper {
            display: flex;
            align-items: center;
            flex: 1;
            min-height: 0;
        }
        .carousel-prev, .carousel-next {
            background: none;
            border: none;
            font-size: 2.5rem;
            cursor: pointer;
            color: #bbb;
            padding: 0 16px;
            flex-shrink: 0;
            transition: color 0.2s;
            user-select: none;
        }
        .carousel-prev:hover, .carousel-next:hover { color: #333; }

        /* override mosaic grid styles */
        .galerie {
            flex: 1;
            display: flex !important;
            align-items: center;
            justify-content: center;
            column-count: unset !important;
            height: 100%;
            padding: 0 !important;
            overflow: hidden;
        }
        .galerie-item {
            display: none;
            margin: 0;
            text-align: center;
            break-inside: unset;
        }
        .galerie-item.active { display: block; }
        .galerie-item img {
            max-height: calc(100vh - 140px);
            max-width: 80vw;
            object-fit: contain;
            /* border-radius: 8px; */
            opacity: 1 !important;
            transform: none !important;
            margin: 0 auto;
            display: block;
        }
        .galerie-item figcaption {
            position: static;
            opacity: 1;
            background: none;
            color: #888;
            font-size: 0.82rem;
            padding: 8px 0 0;
        }
    </style>
</head>

    <script>
        const items = Array.from(document.querySelectorAll('.galerie-item'));
        let current = 0;

        function showSlide(index) {
            items[current].classList.remove('active');
            current = (index + items.length) % items.length;
            items[current].classList.add('active');
        }

        document.getElementById('carousel-prev').addEventListener('click', () => showSlide(current - 1));
        document.getElementById('carousel-next').addEventListener('click', () => showSlide(current + 1));

        const navPanel = document.getElementById('nav-panel');
        const navBackdrop = document.getElementById('nav-panel-backdrop');

        function openNavPanel() {
            navPanel.classList.add('open');
            navBackdrop.classList.add('open');
        }
        function closeNavPanel() {
            navPanel.classList.remove('open');
            navBackdrop.classList.remove('open');
        }

        document.getElementById('index-toggle').addEventListener('click', e => {
            e.preventDefault();
            navPanel.classList.contains('open') ? closeNavPanel() : openNavPanel();
        });

        document.getElementById('nav-panel-close').addEventListener('click', closeNavPanel);
        navBackdrop.addEventListener('click', closeNavPanel);

        document.addEventListener('keydown', e => {
            if (navPanel.classList.contains('open')) {
                if (e.key === 'Escape') closeNavPanel();
                return;
            }
            if (e.key === 'ArrowLeft') showSlide(current - 1);
            if (e.key === 'ArrowRight') showSlide(current + 1);
        });

        showSlide(0);
    </script>
